<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Teleprompter Remote</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #1a1a1a;
        color: #fff;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        box-sizing: border-box;
      }
      
      .header {
        text-align: center;
        margin-bottom: 30px;
      }
      
      .status {
        display: inline-block;
        padding: 5px 15px;
        border-radius: 20px;
        background: #333;
        font-size: 14px;
      }
      
      .status.connected { background: #27ae60; }
      .status.disconnected { background: #e74c3c; }
      
      .main-controls {
        display: flex;
        flex-direction: column;
        gap: 20px;
        flex: 1;
        justify-content: center;
      }
      
      .btn {
        border: none;
        border-radius: 12px;
        padding: 20px;
        font-size: 24px;
        font-weight: bold;
        color: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: opacity 0.2s;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      
      .btn:active { opacity: 0.8; }
      
      .btn-primary { background: #27ae60; }
      .btn-warning { background: #f39c12; }
      .btn-danger { background: #e74c3c; }
      
      .scroll-controls {
        display: flex;
        gap: 15px;
      }
      
      .scroll-controls .btn {
        flex: 1;
        background: #2980b9;
        font-size: 32px;
        padding: 30px 20px;
      }
      
      .slider-container {
        background: #333;
        padding: 20px;
        border-radius: 12px;
        margin-top: 20px;
      }
      
      .slider-container label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 15px;
        font-size: 18px;
      }
      
      input[type="range"] {
        width: 100%;
        height: 10px;
        border-radius: 5px;
        background: #555;
        outline: none;
        -webkit-appearance: none;
      }
      
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #3498db;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div id="status" class="status disconnected">Disconnected</div>
    </div>
    
    <div class="main-controls">
      <button id="btn-play" class="btn btn-primary">▶ Play</button>
      <button id="btn-pause" class="btn btn-warning" style="display: none;">⏸ Pause</button>
      
      <div class="scroll-controls">
        <button id="btn-up" class="btn">↑ Up</button>
        <button id="btn-down" class="btn">↓ Down</button>
      </div>
      
      <button id="btn-reset" class="btn btn-danger">⏹ Reset</button>
      
      <div class="slider-container">
        <label>
          <span>Speed</span>
          <span id="speed-val">150 wpm</span>
        </label>
        <input type="range" id="speed" min="60" max="300" value="150">
      </div>
      
      <div class="slider-container">
        <label>
          <span>Font Size</span>
          <span id="font-size-val">48px</span>
        </label>
        <input type="range" id="font-size" min="16" max="100" value="48">
      </div>
    </div>

    <script src="remote.js"></script>
  </body>
</html>
